services:
  - type: web
    name: aau-ai-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RAG_RETRIEVAL_LIMIT
        value: "3"
      - key: RAG_SCORE_THRESHOLD
        value: "0.35"
      - key: PYTHON_VERSION
        value: 3.11.0
